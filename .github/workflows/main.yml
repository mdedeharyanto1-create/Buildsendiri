name: Build APK Flutter

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip & Find Project Directory
        run: |
          # Ekstrak file ZIP
          unzip -o ready.zip

          # Cari lokasi file pubspec.yaml
          if [ -f "pubspec.yaml" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
            if [ -z "$DIR" ]; then
              echo "❌ ERROR: File pubspec.yaml tidak ditemukan di dalam ZIP!"
              exit 1
            fi
            echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          fi
          echo "✅ Project ditemukan di folder: ${{ env.PROJECT_DIR }}"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: cd ${{ env.PROJECT_DIR }} && flutter pub get

      - name: Build APK
        run: cd ${{ env.PROJECT_DIR }} && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Jadi
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
